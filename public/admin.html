<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark" data-noi18n>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>VERO Admin</title>
    <script>
        (function () {
            try {
                var t = localStorage.getItem('vero_theme');
                if (t) document.documentElement.setAttribute('data-theme', t);
            } catch (e) { }
        })();
    </script>
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Rubik:ital,wght@0,300..900;1,300..900&family=Unbounded:wght@700;800&display=swap">
    <script defer src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
    <link rel="stylesheet" href="/css/style.css?v=14">
    <link rel="stylesheet" href="/css/articles.css?v=14">
    <link rel="stylesheet" href="/css/admin.css?v=14">
</head>

<body>
    <nav class="nav-container" id="navbar">
        <a href="/" class="brand" aria-label="VERO">
            <img src="/assets/logo-96.webp" srcset="/assets/logo-96.webp 1x, /assets/logo-192.webp 2x" width="36" height="36" alt="VERO" class="brand-logo" onerror="this.onerror=null;this.removeAttribute('srcset');this.src='/assets/icon-192.png'">
            <span>VERO</span>
        </a>
        <button class="nav-burger" id="navBurger" type="button" aria-expanded="false" aria-controls="navLinks" aria-label="Menu"><i class="ph ph-list"></i></button>
        <div class="nav-links" id="navLinks">
            <a href="/articles">Articles</a>
            <a href="/articles#account" id="accountBtn" class="icon-btn"><svg class="user-svg" viewBox="0 0 24 24"
                    width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
                    stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="8.2" r="3.7" />
                    <path d="M5 20c.9-4 3.6-6.2 7-6.2s6.1 2.2 7 6.2" />
                </svg></a>
            <button id="themeToggle" class="theme-toggle-btn" type="button" aria-label="Toggle theme"><i
                    class="ph ph-moon" id="themeIcon"></i></button>
        </div>
    </nav>
    <main class="admin-page">
        <div class="admin-head">
            <h1>Admin panel</h1>
            <span id="adminWho" class="admin-meta"></span>
        </div>
        <div class="admin-tabs" id="adminTabs">
            <button type="button" class="active" data-tab="pending">Pending</button>
            <button type="button" data-tab="approved">Published</button>
            <button type="button" data-tab="rejected">Rejected</button>
            <button type="button" data-tab="users">Users</button>
            <button type="button" data-tab="feedback">Feedback</button>
        </div>
        <div id="adminRoot"></div>
    </main>
    <script defer src="/javascript/common.js?v=14"></script>
    <script defer src="/javascript/admin.js?v=14"></script>
</body>

</html>
